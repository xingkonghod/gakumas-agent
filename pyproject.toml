[project]
name = "gkagent"
version = "0.1.0"
description = "Low-token, low-latency card-play agent for Gakuen Idolmaster"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "opencv-python-headless>=4.9",
  "onnxruntime>=1.18",
  "rich>=13.0",
]

[project.optional-dependencies]
train = [
  "torch>=2.3",
  "onnx>=1.16",
  "scikit-learn>=1.4",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gkagent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
