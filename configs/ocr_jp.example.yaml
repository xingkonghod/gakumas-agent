# 日文/多语言 OCR 模型配置（2026-11-22 A1：OCR 换日文模型）
#
# 背景：RapidOCR 内置模型是中文 ch_PP-OCRv4（字典无假名），日文剧情只剩汉字碎片
#      （飲物持 / ？ / 、。）；换成官方 PP-OCRv6 small det+rec（Apache-2.0，多语言）
#      后同一张截图能读出完整日文（ヨーグルトパフェ / つくねハンバーグ / ドリンクバー）。
#
# 用法（三选一，优先级从高到低）：
#   1) 代码里显式指定：OcrEngine(config_path="configs/ocr_jp.yaml")
#   2) 环境变量：set GKAGENT_OCR_CONFIG=configs\ocr_jp.yaml
#   3) 本地自动：scripts/download_ocr_models.py 会生成 configs/ocr_jp.yaml（gitignore），
#      OcrEngine 默认就会用它；删掉该文件即回到内置中文模型。
#
# 正式方案 = 官方 PaddleOCR 模型（Apache-2.0），模型文件放 data/models/（已 gitignore），
# 用 scripts/download_ocr_models.py 下载 + 校验（URL/sha256 都在脚本里）。
# 魔改 MAA（MaaGakumasu，AGPL-3.0）的日文模型只允许本地自用：复制本文件，把下面
# Det/Rec 路径改成 ...\GKMSMAA\resource\base\model\ocr\{det.onnx,rec.onnx,keys.txt}；
# **不得**把 AGPL 模型文件提交进仓库/Gitee。
#
# 注意：本文件是 RapidOCR 内置 config.yaml 的完整拷贝（代码会校验 Global/Det/Cls/Rec 段）。
# 路径支持 %VAR% / $VAR 环境变量；相对路径按本 YAML 所在目录解析。

Global:
    text_score: 0.5
    use_det: true
    use_cls: true
    use_rec: true
    print_verbose: false
    min_height: 30
    width_height_ratio: 8
    max_side_len: 2000
    min_side_len: 30
    return_word_box: false

    intra_op_num_threads: &intra_nums -1
    inter_op_num_threads: &inter_nums -1

Det:
    intra_op_num_threads: *intra_nums
    inter_op_num_threads: *inter_nums

    use_cuda: false
    use_dml: false

    # 官方 PP-OCRv6_small_det（scripts/download_ocr_models.py 下载）
    model_path: ../data/models/ocr_jp/det.onnx

    limit_side_len: 736
    limit_type: min
    # 以下预处理/后处理取自官方 inference.yml（与 PP-OCRv6 训练时一致）
    std: [ 0.229, 0.224, 0.225 ]
    mean: [ 0.485, 0.456, 0.406 ]

    thresh: 0.2
    box_thresh: 0.45
    max_candidates: 3000
    unclip_ratio: 1.4
    use_dilation: true
    score_mode: fast

Cls:
    intra_op_num_threads: *intra_nums
    inter_op_num_threads: *inter_nums

    use_cuda: false
    use_dml: false

    # 方向分类：游戏 UI 全是横排，OcrEngine 里已关掉（use_cls=False）；
    # 保留 RapidOCR 包内默认模型，路径相对包目录解析。
    model_path: models/ch_ppocr_mobile_v2.0_cls_infer.onnx

    cls_image_shape: [3, 48, 192]
    cls_batch_num: 6
    cls_thresh: 0.9
    label_list: ['0', '180']

Rec:
    intra_op_num_threads: *intra_nums
    inter_op_num_threads: *inter_nums

    use_cuda: false
    use_dml: false

    # 官方 PP-OCRv6_small_rec（多语言：中/日/英 + 46 拉丁语系）
    model_path: ../data/models/ocr_jp/rec.onnx

    rec_keys_path: ../data/models/ocr_jp/keys.txt

    rec_img_shape: [3, 48, 320]
    rec_batch_num: 6
